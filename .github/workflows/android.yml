name: Alal Zip APK (debug + optimized release)

on:
  workflow_dispatch:
  push:
    branches: [main, fix/build-failure-20260923]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.build.outputs.failed }}
      summary: ${{ steps.build.outputs.summary }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify wrapper and source
        run: |
          chmod +x ./gradlew
          python3 tools/check_source.py
      - name: Capture failing Gradle stage
        id: build
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/diagnostic-build.log"
          : > "$log"
          stage="assembleDebug"
          ./gradlew assembleDebug --no-daemon --stacktrace >> "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            stage="testDebugUnitTest+lintDebug"
            ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace >> "$log" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage="assembleRelease"
            ./gradlew assembleRelease --no-daemon --stacktrace >> "$log" 2>&1
            status=$?
          fi
          export DIAGNOSTIC_LOG="$log" DIAGNOSTIC_STAGE="$stage" DIAGNOSTIC_STATUS="$status"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          path = os.environ["DIAGNOSTIC_LOG"]
          stage = os.environ["DIAGNOSTIC_STAGE"]
          status = int(os.environ["DIAGNOSTIC_STATUS"])
          lines = open(path, errors="replace").read().splitlines()
          if status == 0:
              detail = "all Gradle stages passed"
          else:
              candidates = [
                  line.strip() for line in lines
                  if re.search(r"(^e: |\bError: |^Execution failed for task|There were failing tests|A failure occurred while executing)", line)
              ]
              detail = candidates[0] if candidates else next((line.strip() for line in reversed(lines) if line.strip()), "unknown failure")
          detail = re.sub(r"/home/runner/work/[^/]+/[^/]+/", "", detail)
          detail = re.sub(r"\s+", " ", detail).replace("%", "pct")[:170]
          print(f"failed={'true' if status else 'false'}")
          print(f"summary={stage}: {detail}")
          PY
          exit 0

  result:
    needs: diagnose
    name: "Result — ${{ needs.diagnose.outputs.summary }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Report diagnostic result
        env:
          FAILED: ${{ needs.diagnose.outputs.failed }}
          SUMMARY: ${{ needs.diagnose.outputs.summary }}
        run: |
          echo "$SUMMARY"
          test "$FAILED" = "false"
