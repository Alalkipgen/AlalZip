name: Archive APK (debug + optimized release)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify wrapper, source and native tool
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${GITHUB_WORKSPACE}/gradlew"
          python3 "${GITHUB_WORKSPACE}/tools/check_source.py"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt2" version
          java -version
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Run JVM tests and Android lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Verify and name the actual APK
        shell: bash
        run: |
          set -euo pipefail
          apk="${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "$apk"
          mkdir -p "${RUNNER_TEMP}/alal-zip-artifact"
          cp "$apk" "${RUNNER_TEMP}/alal-zip-artifact/Archive-debug.apk"
          sha256sum "${RUNNER_TEMP}/alal-zip-artifact/Archive-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Archive-debug
          path: ${{ runner.temp }}/alal-zip-artifact/Archive-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Build optimized release APK (R8)
        shell: bash
        env:
          ALAL_KEYSTORE_BASE64: ${{ secrets.ALAL_KEYSTORE_BASE64 }}
          ALAL_KEYSTORE_PASSWORD: ${{ secrets.ALAL_KEYSTORE_PASSWORD }}
          ALAL_KEY_ALIAS: ${{ secrets.ALAL_KEY_ALIAS }}
          ALAL_KEY_PASSWORD: ${{ secrets.ALAL_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          for name in ALAL_KEYSTORE_BASE64 ALAL_KEYSTORE_PASSWORD ALAL_KEY_ALIAS ALAL_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing $name secret"
              exit 1
            fi
          done
          printf '%s' "$ALAL_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/alal-release.jks"
          export ALAL_KEYSTORE_FILE="${RUNNER_TEMP}/alal-release.jks"
          echo "Signing release with the permanent Archive key"
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify and name the release APK
        shell: bash
        env:
          EXPECTED_CERT_SHA256: "beddcc8e2e5210b47861ebe171a09e50bc5f3607b2d717c050a86de8019792c8"
        run: |
          set -euo pipefail
          apk="${GITHUB_WORKSPACE}/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          signature_output="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$signature_output"
          actual_cert_sha256="$(printf '%s\n' "$signature_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          if [ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Release APK was not signed by the permanent Archive key"
            exit 1
          fi
          echo "Permanent release signature verified"
          mkdir -p "${RUNNER_TEMP}/alal-zip-release"
          cp "$apk" "${RUNNER_TEMP}/alal-zip-release/Archive-release.apk"
          ls -l "${RUNNER_TEMP}/alal-zip-release/Archive-release.apk"
          sha256sum "${RUNNER_TEMP}/alal-zip-release/Archive-release.apk"
      - name: Upload release APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Archive-release
          path: ${{ runner.temp }}/alal-zip-release/Archive-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
