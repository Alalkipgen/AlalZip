name: Final icon and error-log fix

on:
  push:
    paths:
      - ".github/workflows/final-icon-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Apply final icons and source-check fix
        run: python3 tools/apply_final_icons.py
      - name: Verify the reported failure is fixed
        run: python3 tools/check_source.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main tools/check_source.py
          git commit -m "fix: apply final app and archive-file icons"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Build and test
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Commit verification marker
        run: |
          date -u > .final-icon-build-ok
          git add .final-icon-build-ok
          git commit -m "test: verify final icon build"
          git pull --rebase origin main
          git push origin HEAD:main
