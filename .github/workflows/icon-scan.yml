name: Icon patch

on:
  push:
    paths:
      - ".github/workflows/icon-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Apply icon patch
        run: |
          python3 tools/patch_icons.py
          rm -f icon-scan.txt
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restyle in-app archive glyph to match new icon"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Commit build marker
        run: |
          date -u > .icon-build-ok
          git add .icon-build-ok
          git commit -m "test: verify icon restyle build"
          git pull --rebase origin main
          git push origin HEAD:main
