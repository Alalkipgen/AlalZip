name: Icon scan

on:
  push:
    paths:
      - ".github/workflows/icon-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Scan icon usage
        run: |
          {
            echo "=== drawable / mipmap references ==="
            grep -rn "R\.drawable\.\|R\.mipmap\.\|painterResource" app/src/main/java || true
            echo
            echo "=== material icon usage ==="
            grep -rn "Icons\." app/src/main/java || true
            echo
            echo "=== archive/zip icon helpers ==="
            grep -rn -i "icon" app/src/main/java | grep -v "Icons\." || true
          } > icon-scan.txt
          wc -l icon-scan.txt
      - name: Commit scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-scan.txt
          git commit -m "chore: record icon usage scan"
          git pull --rebase origin main
          git push origin HEAD:main
