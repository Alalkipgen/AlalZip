name: Icon scan

on:
  push:
    paths:
      - ".github/workflows/icon-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Dump icon composables
        run: |
          F=app/src/main/java/app/archivepocket/MainActivity.kt
          {
            echo "=== 120-145 palette ==="
            sed -n '120,145p' $F
            echo "=== 300,470 icons ==="
            sed -n '300,470p' $F
            echo "=== 1100,1135 archive rows ==="
            sed -n '1100,1135p' $F
          } > icon-scan.txt
          wc -l icon-scan.txt
      - name: Commit scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-scan.txt
          git commit -m "chore: record icon composable dump"
          git pull --rebase origin main
          git push origin HEAD:main
