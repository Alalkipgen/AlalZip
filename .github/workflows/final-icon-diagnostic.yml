name: Final icon build diagnostic

on:
  push:
    paths:
      - ".github/workflows/final-icon-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Run source checks and Gradle
        id: verify
        shell: bash
        run: |
          set +e
          {
            python3 tools/check_source.py
            SOURCE=$?
            if [ "$SOURCE" -eq 0 ]; then
              ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
              RESULT=$?
            else
              RESULT=$SOURCE
            fi
            echo "RESULT=$RESULT"
          } 2>&1 | tee final-icon-build.log
          RESULT=$(tail -n 1 final-icon-build.log | sed 's/RESULT=//')
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.verify.outputs.result }}" = "0" ]; then
            date -u > .final-icon-build-ok
            rm -f final-icon-build.log
            git add -A
            git commit -m "test: verify final icon build"
          else
            git add final-icon-build.log
            git commit -m "test: capture final icon build failure"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
