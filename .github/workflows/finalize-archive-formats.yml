name: Finalize and verify archive formats
on:
  push:
    branches: [main]
    paths: [scripts/finalize_archive_formats.py]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Update validation and docs
        run: |
          python3 scripts/finalize_archive_formats.py
          python3 tools/check_source.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/check_source.py README.md KNOWN_LIMITATIONS.md
          git commit -m 'docs: validate 7z and tar.gz support'
          git push
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Record successful build
        run: |
          git pull --rebase
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          echo "7z and TAR.GZ build verified" > .archive-format-build-ok
          git add .archive-format-build-ok
          git commit -m 'test: verify archive format build'
          git push
