name: Add 7z and TAR.GZ support
on:
  push:
    branches: [main]
    paths:
      - scripts/add_archive_formats.py
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Apply archive-format integration
        run: python3 scripts/add_archive_formats.py
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Commit verified integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add settings.gradle.kts app/build.gradle.kts app/proguard-rules.pro app/src/main/java
          git commit -m 'feat: add encrypted 7z and tar.gz support'
          git push
