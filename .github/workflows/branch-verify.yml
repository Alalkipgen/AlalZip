name: Branch verify (temporary)

on:
  push:
    branches: [fix/archive-sheet-actions-visible]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Structural source checks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${GITHUB_WORKSPACE}/gradlew"
          python3 "${GITHUB_WORKSPACE}/tools/check_source.py"
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Run JVM tests and Android lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Build optimized release APK (R8)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
